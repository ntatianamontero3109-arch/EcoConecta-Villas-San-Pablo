
services:
  - type: web
    name: ecoconecta-villas-san-pablo
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: EcoConecta
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ecoconecta-postgres
          property: connectionString
      - key: ACCESS_TOKEN_MINUTES
        value: "720"
      - key: POINTS_PER_KG
        value: "1"
      - key: WHATSAPP_ENABLED
        value: "false"

databases:
  - name: ecoconecta-postgres
    databaseName: ecoconecta
    user: ecoconecta
    plan: free
    region: ohio
    postgresMajorVersion: "16"
